<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireless Heatmap Planner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Wireless Heatmap Planner</h1>
      <p>Upload a floor plan, infer wall geometry, and auto-design AP/channel plans.</p>
    </header>

    <main>
      <section class="controls">
        <label>
          Floor plan image
          <input id="planUpload" type="file" accept="image/*" />
        </label>

        <div class="grid">
          <label>
            Desired minimum signal (dBm)
            <input id="targetSignal" type="number" value="-67" min="-90" max="-40" />
          </label>
          <label>
            AP Tx power (dBm)
            <input id="txPower" type="number" value="20" min="1" max="30" />
          </label>
          <label>
            Path loss exponent
            <input id="pathLoss" type="number" value="2.4" min="1.6" max="4" step="0.1" />
          </label>
          <label>
            Wall attenuation per crossing (dB)
            <input id="wallLoss" type="number" value="8" min="2" max="20" step="0.5" />
          </label>
          <label>
            AP spacing floor (meters)
            <input id="apSpacing" type="number" value="8" min="3" max="30" step="1" />
          </label>
          <label>
            Pixels per meter
            <input id="ppm" type="number" value="30" min="5" max="200" step="1" />
          </label>
        </div>

        <button id="runBtn">Generate Design</button>
        <pre id="stats"></pre>
      </section>

      <section class="canvas-wrap">
        <canvas id="planCanvas" width="1200" height="800"></canvas>
        <canvas id="heatCanvas" width="1200" height="800"></canvas>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
